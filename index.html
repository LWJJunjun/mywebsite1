<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unnamed</title>
<style>
  body {
    max-width: 600px;
    margin: 20px auto;
    padding: 0 16px;
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.7;
    color: #222;
    background-color: #ffffff;
    word-wrap: break-word;
  }
  
  /* 调整了光标的位置，只作用于内部 span */
  .typewriter {
    display: inline-block;
    border-right: 2px solid #222;
    animation: blink 0.75s step-end infinite;
  }

  .typewriter.done {
    border-right-color: transparent;
    animation: none;
  }

  @keyframes blink {
    0%, 100% { border-color: transparent; }
    50% { border-color: #222; }
  }
  
  h1 { 
    font-size: 24px; 
    margin-bottom: 8px;
    min-height: 36px; 
  }
  
  h4 { 
    font-weight: normal; 
    color: #666; 
    margin-top: 0; 
    margin-bottom: 24px;
    min-height: 26px;
  }
  
  a { 
    color: #1a5fb4; 
    text-decoration: none;
  }
  
  a:hover {
    text-decoration: underline;
  }
  
  hr { 
    border: none; 
    border-top: 1px solid #eee; 
    margin: 30px 0; 
  }

  /* 名言区域样式 */
  .quote-box {
    padding: 16px;
    background-color: #f9f9f9;
    border-left: 3px solid #ddd;
    border-radius: 0 4px 4px 0;
    cursor: pointer;
    transition: background-color 0.2s;
    user-select: none;
  }
  
  .quote-box:hover {
    background-color: #f0f0f0;
  }

  .quote-text {
    font-style: italic;
    color: #555;
    margin: 0 0 8px 0;
    /* 稍微加高一点，防止文字长短不一导致页面跳动 */
    min-height: 60px; 
  }

  .quote-hint {
    font-size: 12px;
    color: #aaa;
    text-align: right;
    margin: 0;
  }

  @media (max-width: 600px) {
    body { margin: 15px auto; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

  <h1><span class="typewriter" id="title-cn"></span></h1>
  <h4><span class="typewriter" id="title-en"></span></h4>

  <p>
    这个页面还没想好要干什么，先放着。<br>
    以后可能会写点东西，也可能不会。
  </p>

  <hr>

  <p>
    最近在折腾：<br>
    <a href="#">一个链接</a>、<a href="#">另一个链接</a>
  </p>

  <p>
    联系我：<a href="mailto:you@example.com">you@example.com</a>
  </p>

  <hr>

  <!-- 名言区域 -->
  <div class="quote-box" id="quoteBox" title="点击切换一句">
    <p class="quote-text" id="quoteText">加载中...</p>
    <p class="quote-hint">[ 点击切换 ]</p>
  </div>

  <p style="color:#999; font-size:13px; margin-top: 30px;">
    100% BUG web<br>
Since November 7th, 2026
  </p>

<script>
  // --- 打字机逻辑 ---
  function typeEffect(elementId, text, speed, callback) {
    const el = document.getElementById(elementId);
    let i = 0;
    
    function type() {
      if (i < text.length) {
        el.textContent += text.charAt(i);
        i++;
        setTimeout(type, speed);
      } else {
        el.classList.add('done'); 
        if (callback) callback(); 
      }
    }
    type();
  }

  typeEffect('title-cn', '你好，欢迎来到此网站', 120, function() {
    typeEffect('title-en', 'Hello, welcome to this website', 50);
  });

  // --- 莫名其妙的名人名言逻辑 ---
  const quotes = [
    "笛卡尔：“我思故我在；我不思的时候，大概在找遥控器。”",
    "牛顿：“如果说我看得更远，那是因为我站在巨人的肩膀上；但巨人也有肩周炎。”",
    "爱因斯坦：“想象力比知识更重要；因为知识有截止日期，想象力没有。”",
    "鲁迅：“其实地上本没有路，走的人多了，也便成了路；但走错的人多了，也便成了堵点。”",
    "马克·吐温：“真相比小说更离奇，因为小说必须合乎逻辑；而星期一不必。”",
    "莎士比亚：“生存还是毁灭，这是一个问题；中午吃什么，是另一个。”",
    "尼采：“那些杀不死我的，使我更强大；那些杀不死我又让我加班的，使我更想下班。”",
    "达尔文：“物竞天择，适者生存；但会议室里，先到者得插座。”"
  ];

  let currentQuoteIndex = -1;
  const quoteTextEl = document.getElementById('quoteText');
  const quoteBoxEl = document.getElementById('quoteBox');

  function changeQuote() {
    let newIndex = currentQuoteIndex;
    // 确保不会连续抽到同一句
    while (newIndex === currentQuoteIndex) {
      newIndex = Math.floor(Math.random() * quotes.length);
    }
    currentQuoteIndex = newIndex;
    
    // 淡出淡入效果
    quoteTextEl.style.opacity = 0;
    setTimeout(() => {
      quoteTextEl.textContent = quotes[currentQuoteIndex];
      quoteTextEl.style.opacity = 1;
      quoteTextEl.style.transition = 'opacity 0.3s';
    }, 150);
  }

  // 页面加载时随机显示一句
  changeQuote();

  
  quoteBoxEl.addEventListener('click', changeQuote);
</script>
</body>
</html>
